<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walid AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
<div id="app">
    <aside>
        <div class="brand">
            <button onclick="document.body.classList.toggle('light')">🌙</button>
            Walid AI
        </div>
        <input class="search" id="searchInput" placeholder="بحث في المحادثات..." oninput="searchConv()">
        <button onclick="newConv()">+ محادثة جديدة</button>
        <div id="convList"></div>
    </aside>
    <main>
        <header>
            <select id="modelSelect">
                <option value="qwen2.5:7b">qwen2.5:7b</option>
                <option value="qwen2.5:14b">qwen2.5:14b</option>
                <option value="qwen2.5-coder:14b">qwen2.5-coder:14b</option>
            </select>
            <span id="status" class="status idle">● جاهز</span>
        </header>
        <div id="msgs">
            <div id="welcome">مرحبًا بك في Walid AI<br><small>تحدث أو ارفع ملفات واسأل عن محتواها.</small></div>
        </div>
        <div id="file-chips"></div>
        <footer>
            <button id="mic" onclick="toggleMic()">🎤</button>
            <textarea id="input" placeholder="اكتب رسالتك..." rows="1"></textarea>
            <button id="send" onclick="sendMsg()">إرسال</button>
            <button id="stop" onclick="stopGen()" style="display:none">إيقاف</button>
            <button onclick="uploadFile()">📎</button>
        </footer>
    </main>
    <div id="files-panel">
        <h3>📁 الملفات</h3>
        <div id="fileList"></div>
    </div>
</div>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
