[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "walid-ai-desktop"
version = "10.1.0"
description = "Local desktop AI agent built with PyQt6 and Ollama"
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["core*", "db*", "search*", "tools*", "agent*", "ui*"]
